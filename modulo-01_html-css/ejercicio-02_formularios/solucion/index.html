<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>El impacto de la IA en el desarrollo de software</title>
		<meta name="description" content="Informate sobre el impacto de la IA en el desarrollo de software.">
	</head>
	<body>
		<header>
		</header>
		<main>
			<h1>Contactanos</h1>
			<h2>Dejanos tu mensaje</h2>
			<form action="/contacto.php" method="POST">
				<fieldset>
					<legend>Datos personales</legend>
					<label for="nombre">Nombre:</label>
					<input type="text" id="nombre" name="nombre" required>
					
					
					<label for="email">Email:</label>
					<input type="email" id="email" name="email" required>
					
					
					<label for="telefono">Teléfono:</label>
					<input type="tel" id="telefono" name="telefono">
					<!-- Asumo que el telefono no es obligatorio para darle variedad al código y no poner todo como required -->
				</fieldset>
				
				<fieldset>
					<legend>Mensaje</legend>
					<label for="motivo">Motivo:</label>
					<select id="motivo" name="motivo">
						<option value="contacto" selected>Contacto</option>
						<option value="colaborar">Colaborar</option>
						<option value="modificación">Solicitud de modificación</option>
						<option value="otros">otros</option>
					</select>
					
					<label for="mensaje">Mensaje:</label>
					<input type="textarea" id="mensaje" name="mensaje" required>
				</fieldset>
				
				<fieldset>
					<legend>Tipo de consulta</legend>
					<input type="checkbox" id="terminos" name="terminos" value="terminos" required>
					<label for="terminos">Acepto los términos</label>
					
					<input type="radio" id="tipoConsulta" name="tipo" value="consulta" checked>
					<label for="tipoConsulta">Consulta</label>
					
					<input type="radio" id="tipoSugerencia" name="tipo" value="sugerencia">
					<label for="tipoSugerencia">Sugerencia</label>
					
				</fieldset>
				<button type="submit">Enviar</button>
			</form>
		</main>

					</ul>
				</li>

		</footer>
	</body>
</html>
