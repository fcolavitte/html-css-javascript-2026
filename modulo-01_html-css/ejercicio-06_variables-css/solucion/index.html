<!DOCTYPE html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sistema de Temas</title>
		<meta name="description" content="Sistema de Temas">
		<link rel="stylesheet" href="base.css">
		<link rel="stylesheet" href="components.css">
		<link rel="stylesheet" href="tokens.css">
	</head>
	<body>
		<header>
		</header>
		<main>
			<button id="theme-toggle">Cambiar tema</button>
			<h1>texto tipo: h1</h1>
			<h2>texto tipo: h2</h2>
			<h3>texto tipo: h3</h3>
			<h4>texto tipo: h4</h4>
			<p>texto tipo: p</p>
			<small>texto tipo: small</small>
			<ul id="paleta-de-colores">
				<li class="item-color" id="color-acento">--color-acento</li>
				<li class="item-color" id="color-borde">--color-borde</li>
				<li class="item-color" id="color-texto">--color-texto</li>
				<li class="item-color" id="color-texto-suave">--color-texto-suave</li>
				<li class="item-color" id="color-superficie">--color-superficie</li>
				<li class="item-color" id="color-fondo">--color-fondo</li>
				<li class="item-color" id="color-secundario">--color-secundario</li>
				<li class="item-color" id="color-primario">--color-primario</li>
			</ul>
			<button id="button-primario">primario</button>
			<button id="button-secundario">secundario</button>
			<button id="button-outlined">outlined</button>
			<button id="button-deshabilitado" disabled>deshabilitado</button>
		</main>
		<footer>
		</footer>
		<script src="theme.js"></script>
	</body>
</html>
